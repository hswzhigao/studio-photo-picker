<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大图查看</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Noto+Serif+SC:wght@600&amp;display=swap">
<style>
body{margin:0;background:#141312}
a{color:#E8D9CB}a:hover{color:#fff}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 100vh; background: #141312; color: #F3EFE9; font-family: 'Noto Sans SC', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 32px; border-bottom: 1px solid #2C2A27">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; text-decoration: none; color: #E8D9CB">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>返回选片
    </a>
    <div style="font-size: 13px; color: #B9B2A8">IMG_1021 · 第 3 / 24 张</div>
    <div style="font-size: 13px; color: #B9B2A8">精修 11 / 20 · 相框 1 / 1 · 摆台 0 / 1</div>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 24px; padding: 24px 32px">
    <div style="flex: 999 1 560px; min-width: 0; display: flex; align-items: center; gap: 16px">
      <button type="button" aria-label="上一张" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #3A3733; background: transparent; color: #F3EFE9; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <div style="flex: 1; min-width: 0; height: 680px; background: #8C9A9B; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" role="img" aria-label="照片预览"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>
        <span style="position: absolute; right: 16px; bottom: 16px; font-size: 12px; color: rgba(255,255,255,0.8)">名人婚纱 · 预览</span>
      </div>
      <button type="button" aria-label="下一张" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #3A3733; background: transparent; color: #F3EFE9; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>

    <aside style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 16px">
      <button type="button" aria-pressed="true" style="min-height: 52px; border-radius: 10px; border: none; background: #A8714B; color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>已选为精修
      </button>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="min-height: 44px; border-radius: 10px; border: 1px solid #3E8580; background: #2E6460; color: #fff; font-size: 14px">✓ 30寸相框</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; border-radius: 10px; border: 1px solid #3A3733; background: transparent; color: #F3EFE9; font-size: 14px">设为10寸摆台</button>
      </div>

      <div style="background: #1F1D1B; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 13px; color: #B9B2A8">谁选了这张</div>
        <div style="display: flex; align-items: center; gap: 8px"><span style="width: 24px; height: 24px; border-radius: 50%; background: #A8714B; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">雅</span>小雅（我）· 精修 + 相框</div>
        <div style="display: flex; align-items: center; gap: 8px"><span style="width: 24px; height: 24px; border-radius: 50%; background: #2E6460; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">杰</span>阿杰 · 精修</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="note" style="font-size: 13px; color: #B9B2A8">给修图师的备注（可选）</label>
        <textarea id="note" rows="4" style="background: #1F1D1B; color: #F3EFE9; border: 1px solid #3A3733; border-radius: 10px; padding: 12px; font-family: inherit; font-size: 14px; resize: vertical">背景路人去掉，皮肤自然一点</textarea>
      </div>
      <p style="margin: 0; font-size: 12px; color: #8F887E; line-height: 1.6">快捷键：← → 切换，空格 选/取消精修</p>
    </aside>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 32px 24px; overflow-x: auto">
    <span style="flex: 0 0 72px; height: 88px; border-radius: 6px; background: #B5A08D"></span>
    <span style="flex: 0 0 72px; height: 88px; border-radius: 6px; background: #7F8C83"></span>
    <span style="flex: 0 0 72px; height: 88px; border-radius: 6px; background: #8C9A9B; outline: 3px solid #A8714B; outline-offset: 2px"></span>
    <span style="flex: 0 0 72px; height: 88px; border-radius: 6px; background: #9E8E8A"></span>
    <span style="flex: 0 0 72px; height: 88px; border-radius: 6px; background: #8E95A3"></span>
    <span style="flex: 0 0 72px; height: 88px; border-radius: 6px; background: #B2A797"></span>
    <span style="flex: 0 0 72px; height: 88px; border-radius: 6px; background: #94877A"></span>
    <span style="flex: 0 0 72px; height: 88px; border-radius: 6px; background: #A89F94"></span>
    <span style="flex: 0 0 72px; height: 88px; border-radius: 6px; background: #8C9A9B"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
