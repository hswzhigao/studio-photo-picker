<div style="min-height: 100vh; background: #FFFFFF; color: #1A1A1A; font-family: 'Noto Sans SC', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">

    <button type="button" aria-label="关闭" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center">

    </button>

  <div style="flex: 1; display: flex; flex-wrap: wrap">
    <div style="flex: 999 1 560px; min-width: 0; background: #F6FAF9; display: flex; align-items: center; justify-content: center; gap: 24px; padding: 32px">
      <button type="button" aria-label="上一张" style="width: 48px; height: 48px; border: 1px solid #C9D3D1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">

      </div>
      <button type="button" aria-label="下一张" style="width: 48px; height: 48px; border: 1px solid #C9D3D1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.5" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </button>

    <aside style="flex: 1 1 380px; max-width: 440px; border-left: 1px solid #E3E8E7; display: flex; flex-direction: column">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>已选为精修
        </button>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">

          <button type="button" aria-pressed="false" style="min-height: 44px; border: 1px solid #C9D3D1; background: #FFFFFF; color: #1A1A1A; font-size: 13px; letter-spacing: 0.08em">设为10寸摆台</button>
        </div>
      </div>

      <div style="display: flex; border-bottom: 1px solid #E3E8E7; padding: 0 28px; gap: 28px" role="tablist">
        <button type="button" role="tab" aria-selected="false" style="min-height: 44px; border: none; background: none; color: #5F6866; font-size: 14px; letter-spacing: 0.12em; padding: 0">选择</button>

        <button type="button" role="tab" aria-selected="false" style="min-height: 44px; border: none; background: none; color: #5F6866; font-size: 14px; letter-spacing: 0.12em; padding: 0">我的备注</button>

      <div style="flex: 1; padding: 20px 28px; display: flex; flex-direction: column; gap: 20px; overflow: auto">

            <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5F6866"><b style="color: #0B5F5A; font-size: 13px">影楼</b>回复 阿杰 · 今天 09:02</div>
            <p style="margin: 0; line-height: 1.7">放心选，眼睛可以在精修时处理。</p>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #E3E8E7; padding-top: 18px">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5F6866"><b style="color: #1A1A1A; font-size: 13px">我</b><span style="padding: 1px 8px; background: #EEF8F7; color: #0B5F5A">仅影楼可见</span>· 10:20</div>
          <p style="margin: 0; line-height: 1.7">这张想做成相框，背景能调亮一点吗？</p>
          <div style="display: flex; gap: 16px; font-size: 13px"><button type="button" style="min-height: 32px; border: none; background: none; color: #0B5F5A; padding: 0">回复</button><button type="button" style="min-height: 32px; border: none; background: none; color: #5F6866; padding: 0">编辑</button><button type="button" style="min-height: 32px; border: none; background: none; color: #5F6866; padding: 0">删除</button></div>
        </div>
      </div>

      <div style="padding: 20px 28px 28px; border-top: 1px solid #E3E8E7; display: flex; flex-direction: column; gap: 12px">
        <label for="cmt" style="font-family: 'Cormorant Garamond', serif; font-size: 12px; letter-spacing: 0.32em; color: #5F6866">LEAVE A NOTE</label>
        <textarea id="cmt" rows="3" placeholder="写下你的想法…" style="border: 1px solid #C9D3D1; border-radius: 0; padding: 12px; font-family: inherit; font-size: 16px; resize: vertical"></textarea>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5F6866"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B5F5A">仅影楼可见</label>
          <button type="button" style="min-height: 44px; padding: 0 24px; border: none; background: #1A1A1A; color: #FFFFFF; font-size: 14px; letter-spacing: 0.16em">发送</button>
        </div>
