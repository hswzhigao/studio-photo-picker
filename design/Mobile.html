<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手机端选片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4F0; color: #1D1C1A; font-family: 'Noto Sans SC', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 16px 12px; background: #fff; border-bottom: 1px solid #E6E1D9; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 16px; font-weight: 700">小雅 &amp; 阿杰 · 婚纱照</div>
      <span style="font-size: 12px; color: #6B655C">截止 11/15</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #F1ECE5; border-radius: 8px; padding: 8px; text-align: center"><div style="font-size: 16px; font-weight: 700; color: #7A4E31">11/20</div><div style="font-size: 11px; color: #4A453E">精修</div></div>
      <div style="background: #F1ECE5; border-radius: 8px; padding: 8px; text-align: center"><div style="font-size: 16px; font-weight: 700; color: #2E6460">1/1</div><div style="font-size: 11px; color: #4A453E">30寸相框</div></div>
      <div style="background: #F1ECE5; border-radius: 8px; padding: 8px; text-align: center"><div style="font-size: 16px; font-weight: 700; color: #2E6460">0/1</div><div style="font-size: 11px; color: #4A453E">10寸摆台</div></div>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <button type="button" style="flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #1D1C1A; color: #fff; font-size: 13px">全部 24</button>
      <button type="button" style="flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFC8BD; background: #fff; color: #1D1C1A; font-size: 13px">我已选 11</button>
      <button type="button" style="flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFC8BD; background: #fff; color: #1D1C1A; font-size: 13px">未选 13</button>
      <button type="button" style="flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #CFC8BD; background: #fff; color: #1D1C1A; font-size: 13px">阿杰选的 8</button>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; align-content: start">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="15">
      <div style="position: relative; aspect-ratio: 4 / 5; background: {{c.tone}}; border-radius: 4px; outline: {{c.outline}}; outline-offset: -3px">
        <span style="position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: {{c.check}}; display: flex; align-items: center; justify-content: center">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        </span>
        <sc-if value="{{c.frame}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 4px; top: 4px; padding: 1px 5px; background: #2E6460; color: #fff; font-size: 10px; border-radius: 4px">相框</span></sc-if>
        <sc-if value="{{c.partner}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 4px; bottom: 4px; width: 18px; height: 18px; border-radius: 50%; background: #2E6460; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1.5px solid #fff">杰</span></sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 16px 24px; background: #fff; border-top: 1px solid #E6E1D9; display: flex; gap: 10px; align-items: center">
    <div style="flex: 1; font-size: 12px; color: #6B655C; line-height: 1.5">点照片看大图<br>点右上角 ✓ 选为精修</div>
    <button type="button" style="min-height: 48px; padding: 0 24px; border: none; border-radius: 10px; background: #1D1C1A; color: #fff; font-size: 15px; font-weight: 700">去提交</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var tones = ['#A89F94', '#8C9A9B', '#B5A08D', '#7F8C83', '#9E8E8A', '#8E95A3', '#B2A797', '#94877A'];
    var picks = { 2: 1, 3: 1, 5: 1, 8: 1, 9: 1, 12: 1, 14: 1 };
    var partner = { 3: 1, 4: 1, 8: 1, 11: 1, 14: 1, 15: 1 };
    var cells = [];
    for (var i = 1; i <= 15; i++) {
      var on = !!picks[i];
      cells.push({
        tone: tones[i % tones.length],
        check: on ? '#7A4E31' : 'rgba(29,28,26,0.35)',
        outline: on ? '3px solid #7A4E31' : '0 solid transparent',
        frame: i === 3,
        partner: !!partner[i]
      });
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
